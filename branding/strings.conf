# Text changes applied to Chromium's UI strings (all languages).
#
# Which string files to edit (relative to chromium/src). These two hold the
# product-branded text ("About Chromium", "Chromium is up to date", ...).
# Add more `file:` lines to edit other .grd files, e.g.
#   file: chrome/app/generated_resources.grd
file: chrome/app/chromium_strings.grd
file: components/components_chromium_strings.grd

# Replacement rules, applied top to bottom, only to visible text:
#   Find text => Replacement text
#   re:regex  => replacement (\1 back-references allowed)
# {BROWSER_NAME}, {COMPANY_NAME} and other neoweb.conf keys are expanded.
#
# "Chromium OS" and "The Chromium Authors" (the license notice) are kept.
re:\bChromium(?!\s?OS\b| Authors\b) => {BROWSER_NAME}

# Your own text changes go here, for example:
# Welcome to {BROWSER_NAME} => Welcome aboard

# NeoWeb configuration.
#
# This file is plain KEY="value" lines. It is read by the shell scripts and by
# scripts/lib/customize.py. After changing anything here, run ./build.sh (it
# re-applies all customizations before building).

# ---------------------------------------------------------------- identity ---
BROWSER_NAME="NeoWeb"
# Lowercase id: profile dir (~/.config/neoweb), .desktop file name, icon name.
BROWSER_ID="neoweb"
COMPANY_NAME="NeoWeb"
# Chromium's BSD license requires keeping the Chromium Authors notice.
COPYRIGHT="Copyright @LASTCHANGE_YEAR@ The NeoWeb Authors and The Chromium Authors. All rights reserved."
MAC_BUNDLE_ID="org.neoweb.NeoWeb"

# ------------------------------------------------------------------- theme ---
# Seed color for the default browser theme (Material "dynamic color").
THEME_COLOR="#00E8DA"
# How strongly the seed color is applied:
#   system | tonal_spot | neutral | vibrant | expressive
THEME_VARIANT="vibrant"
# 1 = new profiles use the NeoWeb theme on Linux instead of GTK colors.
DEFAULT_TO_CLASSIC_THEME="1"

# ---------------------------------------------------------------- chromium ---
# Release channel ./update.sh follows: stable | beta | dev | canary
CHROMIUM_CHANNEL="stable"
# Build output directory, relative to the Chromium src dir.
OUT_DIR="out/NeoWeb"
# Parallel build jobs. Empty = autoninja default. Lower it if you run out of RAM.
BUILD_JOBS=""
